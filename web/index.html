<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#07111f">
<title>FinPilot — התחברות</title>
<link rel="stylesheet" href="style.css?v=20260803-11">
</head>
<body class="auth-layout">
  <div class="card">
    <div class="brand-mark">FP</div>
    <p class="eyebrow" style="margin-top:20px">Portfolio intelligence</p>
    <h1 id="form-title">התחברות</h1>
    <p class="lede">מרכז ההשקעות האישי שלך — תיק, מזומן, ניתוח פונדמנטלי ו־AI מאומת במקום אחד.</p>

    <label for="email">אימייל</label>
    <input id="email" type="email" autocomplete="email" placeholder="you@example.com">

    <label for="password">סיסמה</label>
    <input id="password" type="password" autocomplete="current-password" placeholder="לפחות 6 תווים">
    <p class="field-hint hidden" id="password-hint">הסיסמה חייבת להכיל לפחות 6 תווים.</p>

    <div id="confirm-password-field" class="hidden">
      <label for="confirm-password">אימות סיסמה</label>
      <input id="confirm-password" type="password" autocomplete="new-password" placeholder="הקלד שוב את הסיסמה">
    </div>

    <button id="submit-btn">התחבר</button>
    <div class="error" id="error-msg" role="alert" aria-live="polite"></div>
    <div class="success-msg hidden" id="success-msg" role="status" aria-live="polite"></div>

    <div class="toggle-link">
      <a id="forgot-link">שכחת סיסמה?</a>
    </div>
    <div class="toggle-link">
      <span id="toggle-text">אין לך חשבון? </span><a id="toggle-link">הרשמה</a>
    </div>
  </div>

  <script type="module" src="auth.js"></script>
</body>
</html>
