name: Weekly investment recommendations

on:
  schedule:
    # Every Monday at 07:00 UTC. Adjust to taste — cron is UTC, not local time.
    - cron: "0 7 * * 1"
  workflow_dispatch: {} # lets you trigger a run manually from the Actions tab, for testing

jobs:
  send-recommendations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install Playwright browser
        # Needed for the Globes.co.il fallback price lookup (price_service.py)
        # that kicks in for Israeli-only securities yfinance doesn't carry.
        run: playwright install --with-deps chromium

      - name: Send weekly recommendations
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM_EMAIL: ${{ secrets.RESEND_FROM_EMAIL }}
        run: python weekly_recommendations.py
